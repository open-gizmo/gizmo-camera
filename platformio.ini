; ESP32-CAM (AI Thinker) - HTTP snapshot server

[env:esp32cam]
platform = espressif32@6.5.0
board = esp32cam
framework = arduino

upload_port = COM5
upload_speed = 921600
monitor_port = COM5
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
